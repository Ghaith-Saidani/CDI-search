[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cdi-application-assistant"
version = "0.2.0"
description = "Decision-support system for a France-wide Data/AI CDI search"
requires-python = ">=3.11"
dependencies = ["pypdf>=6.0"]

[project.optional-dependencies]
test = ["reportlab>=5.0"]

[project.scripts]
cdi-evaluate = "cdi_assistant.cli:main"
cdi-discover = "cdi_assistant.discovery_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
